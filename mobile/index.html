<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a1a">
<title>抓知了猴 🦗</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<!-- ================================================================ -->
<!-- SCREEN 1: MAP + RADAR VIEW                                        -->
<!-- ================================================================ -->
<div id="screen-map" class="screen active">
  <!-- Map container -->
  <div id="map"></div>

  <!-- Top status bar -->
  <div class="top-bar">
    <div class="player-info">
      <span class="level">Lv.<span id="top-level">1</span></span>
      <span class="gold">💰 <span id="top-gold">100</span></span>
      <span class="digs">⛏ <span id="top-digs">0</span>/50</span>
    </div>
  </div>

  <!-- Radar overlay -->
  <div id="radar-overlay">
    <div id="radar-sweep"></div>
    <div id="radar-blips"></div>
  </div>

  <!-- Bottom action bar -->
  <div class="bottom-bar">
    <button class="btn-mode active" data-screen="screen-map">🗺️ 地图</button>
    <button class="btn-mode" data-screen="screen-dig">⛏️ 挖掘</button>
    <button class="btn-mode" data-screen="screen-catch">🥅 捕蝉</button>
    <button class="btn-mode" data-screen="screen-profile">👤 我的</button>
  </div>

  <!-- Nymph info popup -->
  <div id="nymph-popup" class="popup hidden">
    <div class="popup-content">
      <button class="popup-close">&times;</button>
      <div class="nymph-card">
        <div class="nymph-rarity" id="popup-rarity">⭐⭐⭐</div>
        <h3 id="popup-species">黑蚱蝉</h3>
        <p>📏 <span id="popup-size">4.2cm</span> | ⚖ <span id="popup-weight">8g</span></p>
        <p>📐 深度: <span id="popup-depth">20cm</span></p>
        <p>💰 估值: ¥<span id="popup-value">5.00</span></p>
        <button class="btn-primary" id="btn-track">🎯 追踪此目标</button>
      </div>
    </div>
  </div>

  <!-- Proximity indicator -->
  <div id="proximity-bar">
    <div class="prox-fill" id="prox-fill"></div>
    <span class="prox-label" id="prox-label">搜索中...</span>
  </div>
</div>

<!-- ================================================================ -->
<!-- SCREEN 2: DIG MODE                                                -->
<!-- ================================================================ -->
<div id="screen-dig" class="screen">
  <div class="dig-container">
    <div class="dig-header">
      <button class="btn-back" data-screen="screen-map">← 返回地图</button>
      <h2>⛏️ 挖掘知了猴</h2>
    </div>

    <div id="dig-target-info" class="dig-info hidden">
      <div class="species-tag" id="dig-species">黑蚱蝉</div>
      <div class="depth-indicator">
        <div class="depth-line">
          <span>地面</span>
          <div class="depth-bar">
            <div class="depth-fill" id="depth-fill"></div>
          </div>
          <span id="depth-value">20cm</span>
        </div>
      </div>
    </div>

    <!-- X-mark area (simulates AR ground targeting) -->
    <div id="dig-area">
      <div id="x-mark" class="x-mark-scanning">✖</div>
      <p id="dig-hint" class="hint-text">将手机对准地面，寻找X标记...</p>
    </div>

    <!-- Dig progress -->
    <div id="dig-progress-container" class="hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="dig-progress-fill"></div>
      </div>
      <p id="dig-count">挖掘中... 0/8</p>
    </div>

    <!-- Dig button -->
    <button id="btn-dig" class="btn-dig" disabled>
      <span class="shovel-icon">🪒</span>
      <span>开始挖掘</span>
    </button>

    <!-- Result popup -->
    <div id="dig-result" class="result-popup hidden">
      <h2 id="result-title"></h2>
      <div id="result-details"></div>
      <button class="btn-primary" id="btn-dig-again">继续寻找</button>
    </div>
  </div>
</div>

<!-- ================================================================ -->
<!-- SCREEN 3: CATCH MODE (simplified)                                 -->
<!-- ================================================================ -->
<div id="screen-catch" class="screen">
  <div class="catch-container">
    <div class="dig-header">
      <button class="btn-back" data-screen="screen-map">← 返回地图</button>
      <h2>🥅 捕蝉雷达</h2>
    </div>

    <div class="catch-radar">
      <div class="catch-scan"></div>
      <p id="catch-status">雷达扫描中... 附近暂无蝉信号</p>
    </div>

    <div id="catch-info" class="catch-info hidden">
      <p>🐞 <span id="catch-species"></span></p>
      <p>📡 距离: <span id="catch-distance"></span>m</p>
      <button class="btn-primary" id="btn-swing">🥅 挥网捕捉!</button>
    </div>

    <p class="hint-text" style="margin-top:20px">⚠️ 捕蝉功能需要连接后端服务</p>
  </div>
</div>

<!-- ================================================================ -->
<!-- SCREEN 4: PROFILE                                                  -->
<!-- ================================================================ -->
<div id="screen-profile" class="screen">
  <div class="profile-container">
    <div class="dig-header">
      <button class="btn-back" data-screen="screen-map">← 返回地图</button>
      <h2>👤 我的</h2>
    </div>

    <div class="profile-card">
      <div class="avatar">🦗</div>
      <h3 id="profile-name">Player</h3>
      <div class="stat-row">
        <div class="stat-item">Lv.<span id="profile-level">1</span></div>
        <div class="stat-item">💰 <span id="profile-gold">100</span></div>
        <div class="stat-item">💎 <span id="profile-diamonds">5</span></div>
      </div>
    </div>

    <div class="tool-section">
      <h3>🔧 装备</h3>
      <div id="tools-list"></div>
    </div>

    <div class="stats-section">
      <h3>📊 统计</h3>
      <div id="player-stats"></div>
    </div>

    <button class="btn-secondary" id="btn-refresh-profile">🔄 刷新数据</button>
  </div>
</div>

<!-- ================================================================ -->
<!-- SCRIPTS                                                           -->
<!-- ================================================================ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
