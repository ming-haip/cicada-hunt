version: "3.8"

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cicada-postgres
    environment:
      POSTGRES_DB: cicada_hunt
      POSTGRES_USER: cicada
      POSTGRES_PASSWORD: cicada_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicada -d cicada_hunt"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: cicada-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Go API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cicada-server
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      ENV: development
      DATABASE_URL: postgres://cicada:cicada_dev@postgres:5432/cicada_hunt?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      MAX_DAILY_DIGS: "50"
      MAX_QUERY_RADIUS_M: "500"
      MAX_RESULTS_PER_QUERY: "50"
      RATE_LIMIT_PER_MIN: "120"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
